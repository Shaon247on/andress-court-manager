name: Deploy Manager Frontend

on:
  push:
    branches:
      - main

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "── Deploying manager frontend ──"

            cd ~/athlongo-frontends/manager
            git pull origin main
            echo "✓ Code pulled"

            cd ~/Athlon-go
            docker compose up -d --build --force-recreate manager-web
            echo "✓ manager-web rebuilt and restarted"

            docker compose restart nginx
            echo "✓ Nginx reloaded"
