name: Deploy Manager Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "── Deploying manager frontend ──"

            cd ~/athlongo-frontends/manager
            git pull origin main
            echo "✓ Code pulled"

            cd ~/Athlon-go
            docker compose up -d --build --force-recreate manager-web
            echo "✓ manager-web rebuilt and restarted"

            docker compose restart nginx
            echo "✓ Nginx reloaded"
